<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="form-style.css">
    <title>Form</title>
  </head>
  <body>
    <div class="registrationform">
      <form action="" id="form-1">
        <table>
            <tr>
                <th colspan="3">Registration Form</th>
            </tr>
          <tr>
            <td><label for="fname">First Name</label></td>
            <td>:</td>
            <td><input type="text" id="first_name" /></td>
          </tr>
          <tr>
            <td><label for="lname">Last Name</label></td>
            <td>:</td>
            <td><input type="text" id="last_name" /></td>
          </tr>
          <tr>
            <td><label for="gender">Gender</label></td>
            <td>:</td>
            <td>
              <input type="radio" name="gender" value="Male" id="male" />
              <label for="male">Male</label>
              <input type="radio" name="gender" value="Female" id="female" />
              <label for="female">Female</label>
            </td>
          </tr>
          <tr>
            <td><label for="dateofbirth">Date of Birth </label></td>
            <td>:</td>
            <td><input type="date" id="dob" /></td>
          </tr>
          <tr>
            <td><label for="Address">Address</label></td>
            <td>:</td>
            <td><textarea name="Address" id="address"></textarea></td>
          </tr>
          <tr>
            <td><label for="Hobby">Hobby </label></td>
            <td>:</td>
            <td>
              <input
                type="checkbox"
                name="dancing"
                id="dancing"
                value="dancing"
              />
              <label for="dancing">dancing</label>
              <input
                type="checkbox"
                name="singing"
                id="singing"
                value="singing"
              />
              <label for="singing">singing</label>
              <input
                type="checkbox"
                name="playing"
                id="playing"
                value="playing"
              />
              <label for="playing">playing</label>
            </td>
          </tr>
          <tr>
            <td><label for="contact">Contact No.</label></td>
            <td>:</td>
            <td>
              <input
                type="tel"
                id="phone"
                name="phone"
                pattern="[1-9]{1}[0-9]{9}"
              />
            </td>
          </tr>
          <tr>
            <td><label for="password">Password</label></td>
            <td>:</td>
            <td><input type="text" id="password" /></td>
          </tr>
          <tr>
            <td>
              <label for="confirm-password">Confirm Password</label>
            </td>
            <td>:</td>
            <td><input type="text" id="confirm_password" /></td>
          </tr>
          <tr>
            <td colspan="3" align="center">
              <input
                type="submit"
                name="Submit"
                value="Submit"
                id="submit_buttton"
              />
              <input
                type="reset"
                name="Reset"
                value="Reset"
                id="reset_buttom"
              />
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
